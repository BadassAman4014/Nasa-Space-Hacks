services:
  # FastAPI Backend Service (Docker) - FREE TIER
  - type: web
    name: nasa-space-hacks-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      # NASA Earthdata credentials (set in Render dashboard)
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
      - key: EARTHDATA_TOKEN
        sync: false
      # Google Gemini API
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # Disable the PyTorch field-segmentation API on the 512 MB free plan.
      - key: ENABLE_FIELD_SEGMENTATION
        value: "false"
      # CORS settings
      - key: CORS_ORIGINS
        value: https://guiding-spendable-spinal.ngrok-free.dev,http://localhost:5173
    healthCheckPath: /health
    autoDeploy: true

