services:
  # FastAPI Backend Service (Docker) - FREE TIER
  - type: web
    name: nasa-space-hacks-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      # NASA Earthdata credentials (set in Render dashboard)
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
      - key: EARTHDATA_TOKEN
        sync: false
      # Google Gemini API
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      # CORS settings - update with your Vercel domain after deployment
      - key: CORS_ORIGINS
        value: http://localhost:5173  # Will update after Vercel deploy
    healthCheckPath: /health
    autoDeploy: true

